# 每次 push／PR 都跑：規則、多語系、SEO、電腦勝率排序、線上多客戶端實測
name: 測試
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"
          cache: npm
      - run: npm ci
      - run: node tests/verify.js
      - run: node tests/localization.js
      - run: node tests/seo.js
      - run: node tests/ai-ladder.js 400
      - run: node scripts/online-check.js

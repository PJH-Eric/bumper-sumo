# Render 藍圖（只準備，不自動建立服務）：New > Blueprint 指到這個 repo 即可部署後端。
# 免費方案會休眠；房間只存在記憶體，重啟後消失是預期行為。首頁與單機不會喚醒它。
services:
  - type: web
    name: bumper-sumo
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "26.12.1"
      # 前端放 GitHub Pages 時填 https://<帳號>.github.io（逗號分隔多個來源）
      - key: GAME_ALLOWED_ORIGIN
        sync: false
      - key: COUNTDOWN_MS
        value: "3000"
      - key: RECONNECT_MS
        value: "10000"
